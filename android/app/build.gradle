
plugins {
    id "com.android.application"
    id "dev.flutter.flutter-gradle-plugin"
    id 'com.google.gms.google-services'

}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader("UTF-8") { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty("flutter.versionCode")
if (flutterVersionCode == null) {
    flutterVersionCode = "1"
}

def flutterVersionName = localProperties.getProperty("flutter.versionName")
if (flutterVersionName == null) {
    flutterVersionName = "1.0"
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

// A release must never be produced with missing or incomplete signing data.
def releaseRequested = gradle.startParameter.taskNames.any {
    it.toLowerCase().contains('release')
}
if (releaseRequested) {
    def envPath = System.getenv('ANDROID_KEYSTORE_PATH')
    if (envPath) {
        def requiredEnv = [
            'ANDROID_KEYSTORE_ALIAS',
            'ANDROID_KEYSTORE_PRIVATE_KEY_PASSWORD',
            'ANDROID_KEYSTORE_PASSWORD',
        ]
        def missing = requiredEnv.findAll { !System.getenv(it)?.trim() }
        if (!missing.isEmpty()) {
            throw new GradleException("Missing Android release signing environment variables: ${missing.join(', ')}")
        }
        if (!file(envPath).isFile()) {
            throw new GradleException('ANDROID_KEYSTORE_PATH does not point to a file')
        }
    } else {
        if (!keystorePropertiesFile.isFile()) {
            throw new GradleException('Android release signing requires android/key.properties or ANDROID_KEYSTORE_PATH')
        }
        def requiredProperties = ['storeFile', 'storePassword', 'keyAlias', 'keyPassword']
        def missing = requiredProperties.findAll { !keystoreProperties.getProperty(it)?.trim() }
        if (!missing.isEmpty()) {
            throw new GradleException("Missing Android release signing properties: ${missing.join(', ')}")
        }
        if (!file(keystoreProperties.getProperty('storeFile')).isFile()) {
            throw new GradleException('Android release storeFile does not point to a file')
        }
    }
}

android {
    namespace = "com.gurbanov.yaka"
    compileSdkVersion 37
    // ndkVersion "30.0.14904198"
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true

    }

  
    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }
    lintOptions {
        disable 'InvalidPackage'
        checkReleaseBuilds false //<- add this line
    }
    defaultConfig {
        applicationId "com.gurbanov.yaka"
        minSdkVersion flutter.minSdkVersion
        targetSdkVersion 36
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        multiDexEnabled true
    }

    signingConfigs {
        if (System.getenv("ANDROID_KEYSTORE_PATH")) {
            release {
                storeFile file(System.getenv("ANDROID_KEYSTORE_PATH"))
                keyAlias System.getenv("ANDROID_KEYSTORE_ALIAS")
                keyPassword System.getenv("ANDROID_KEYSTORE_PRIVATE_KEY_PASSWORD")
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
            }
        } else {
            release {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
                storePassword keystoreProperties['storePassword']
            }
        }
    }

    buildTypes {
        release {
            signingConfig = signingConfigs.release
        }
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

flutter {
    source = "../.."
}
dependencies {
    implementation 'androidx.documentfile:documentfile:1.1.0'
    implementation 'com.google.android.gms:play-services-auth:21.2.0'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
}
