name: yaka2
version: 4.0.4+61
publish_to: none
description: YAKA marketplace for Turkmen embroidery patterns and sewing products.
environment:
  sdk: ">=3.13.0 <4.0.0"

dependencies:
  audioplayers: ^6.0.0
  badges:
  bloc: ^9.0.0
  cached_network_image: ^4.0.4
  carousel_slider: ^5.0.0
  chewie: ^1.7.0
  cupertino_icons:
  dio: ^5.7.0
  equatable: ^3.0.0
  firebase_analytics: ^13.0.0
  firebase_core: ^5.0.0
  firebase_messaging: ^17.0.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.0.0
  flutter_cache_manager: ^3.4.1
  flutter_local_notifications: ^22.3.2
  get_it: ^9.3.0
  go_router: ^18.1.0
  hive_flutter: ^1.1.0
  http:
  hugeicons: ^1.2.0
  image_picker: ^1.2.0
  lottie:
  media_kit: ^1.1.11
  # iOS-only native decoders (Opus/OGG/WebM) for voice-message playback.
  # Android keeps using audioplayers, so no Android media_kit libs are added.
  media_kit_libs_ios_audio: ^1.1.4
  package_info_plus: ^10.2.2
  path_provider: ^2.1.0
  permission_handler: ^13.0.2
  photo_view:
  pin_input_text_field: ^4.5.3
  pull_to_refresh:
  share_plus: ^13.3.1
  shimmer: ^4.0.0
  sms_autofill: ^2.4.0
  socket_io_client: ^3.1.4
  tutorial_coach_mark: ^1.3.0
  upgrader: ^13.7.0
  url_launcher:
  video_player: ^2.7.2
  video_thumbnail_plus: ^0.0.2
  webview_flutter: ^4.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter

dependency_overrides:
  firebase_analytics:
    path: third_party/flutterfire/firebase_analytics
  firebase_core:
    path: third_party/flutterfire/firebase_core
  video_thumbnail_plus:
    path: third_party/video_thumbnail_plus

flutter:
  assets:
    - assets/icons/
    - assets/lottie/
    - assets/image/
    - assets/audio/

  fonts:
    - family: Gilroy
      fonts:
        - asset: assets/fonts/Gilroy-Light.ttf
          weight: 300
        - asset: assets/fonts/Gilroy-Regular.ttf
          weight: 400
        - asset: assets/fonts/Gilroy-Medium.ttf
          weight: 500
        - asset: assets/fonts/Gilroy-Semibold.ttf
          weight: 600
        - asset: assets/fonts/Gilroy-Bold.ttf
          weight: 700
        - asset: assets/fonts/Gilroy-Extrabold.ttf
          weight: 800

  uses-material-design: true
